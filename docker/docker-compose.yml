services:
  openscience:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: openscience:latest
    environment:
      - OPENSCIENCE_BIN_PATH=${OPENSCIENCE_BIN_PATH:-/usr/local/bin/openscience-native}
      - SKILLS_PATH=/app/backend/cli/skills
      - OPENSCIENCE_INSTALL_SKILL_DEPS=${OPENSCIENCE_INSTALL_SKILL_DEPS:-0}
      - SOCAT_PORT=${SANDBOX_PORT:-18080}
      - PATH=/home/openscience/.venv/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      # Skills are documentation: mount read-only into the sandbox.
      - ../backend/cli/skills:/app/backend/cli/skills:ro
      # Writable, persistent sandbox user home (venv, cache, openscience data).
      - openscience-home:/home/openscience
      # Workspace: everything you save while working (projects, files, outputs)
      # persists here in the named volume `docker_openscience-workspace`.
      - workspace:/home/openscience/workspace
    # The headless server and `exec` shells land in the workspace by default.
    working_dir: /home/openscience/workspace
    # Host port for the web UI. The openscience server only listens on 127.0.0.1
    # inside its own namespace, so the entrypoint starts a socat proxy that binds
    # this port on the container interface and forwards to the loopback server.
    ports:
      - "${SANDBOX_PORT:-18080}:${SANDBOX_PORT:-18080}"
    restart: unless-stopped
    command: ["serve", "--port", "8080", "--print-logs"]
    healthcheck:
      test: ["CMD-SHELL", "openscience --version || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
    # Sandbox backend: the openscience execution sandbox uses bubblewrap (bwrap)
    # mount/PID namespaces. On this Docker daemon that only works when:
    #   - the container runs as root (Docker clears ALL capabilities for non-root
    #     users at exec, and unprivileged user namespaces are host-restricted),
    #   - CAP_SYS_ADMIN is granted (needed for mount/PID/net namespaces),
    #   - seccomp/apparmor are unconfined (their defaults block the nested
    #     namespace syscalls).
    # Everything else stays sandboxed: read-only rootfs, tmpfs /tmp, and the two
    # named volumes below.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

volumes:
  openscience-home:
  workspace: